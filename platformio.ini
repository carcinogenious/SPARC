[platformio]
src_dir = firmware/src
lib_dir = firmware/lib

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    ; Sensors
    adafruit/Adafruit BMP3XX Library
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    pololu/VL53L1X

    ; SD card logging — use the SD library bundled with the ESP32 Arduino
    ; framework (the arduino-libraries/SD package is AVR-era and won't
    ; compile on ESP32-S3). No lib_deps entry needed; just #include <SD.h>.

    ; Servo control (ESP32-compatible, replaces arduino Servo library)
    madhephaestus/ESP32Servo

    ; LoRa (SX1262 on Heltec V3)
    sandeepmistry/LoRa

    ; OLED display (built-in 0.96" on Heltec V3)
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays

upload_speed = 921600
monitor_filters = esp32_exception_decoder
